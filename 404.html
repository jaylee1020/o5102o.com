<!DOCTYPE html>
<html lang="ko" data-theme="3">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dcdcdc">
  <title>404 — o5102o</title>
  <script>var t=new URLSearchParams(location.search).get('t')||localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);</script>
  <style>
    html[data-theme="2"]{--bg:#1a1a1e;--fg:#dcdcdc}
    html[data-theme="3"]{--bg:#1b00c8;--fg:#dcdcdc}
    html[data-theme="4"]{--bg:#0a0a0a;--fg:#4ade80}
    html[data-theme="5"]{--bg:#ffe916;--fg:#1b00c8}
    :root{--bg:#dcdcdc;--fg:#1b00c8}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{
      min-height:100vh;min-height:100dvh;height:100%;
      font-size:17px;line-height:26px;
      font-family:"SF Mono",ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Monaco,Consolas,monospace;
      font-weight:400;background:var(--bg);color:var(--fg);
      -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
    }
    .outer{width:100%;min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:flex-start;padding:40px 36px;padding-top:max(40px,env(safe-area-inset-top,0px))}
    .inner{width:100%;max-width:480px}
    .row{height:26px;width:100%}
    .row p{display:inline-block;padding-left:3px}
    .dim{opacity:.45}
    .back{display:inline-block;padding:1px 4px;border-radius:2px;text-decoration:none;color:var(--fg);opacity:.45;margin-top:36px}
    .back:hover{opacity:1}
    @media(max-width:768px){body{font-size:16px;line-height:28px}.outer{padding:28px 20px;padding-top:max(28px,env(safe-area-inset-top,0px))}.row{height:28px}}
  </style>
</head>
<body>
  <div class="outer"><div class="inner">
    <div class="row"><p>404</p></div>
    <div class="row"><p class="dim">페이지를 찾을 수 없습니다.</p></div>
    <a class="back" href="https://o5102o.com">&larr; o5102o.com</a>
  </div></div>
</body>
</html>
