<!DOCTYPE html>
<html lang="ko" data-theme="1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <title>blog — o5102o</title>
  <meta name="description" content="blog — o5102o">
  <meta name="theme-color" content="#dcdcdc">
  <link rel="canonical" href="https://blog.o5102o.com/">
  <meta property="og:title" content="blog — o5102o">
  <meta property="og:description" content="THOUGHTS, NOTES, AND LOGS">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://blog.o5102o.com/">
  <meta property="og:site_name" content="o5102o">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:image" content="https://blog.o5102o.com/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <script>var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);</script>
  <style>
    /* Themes */
    html[data-theme="1"]{--bg:#dcdcdc;--fg:#1b00c8}
    html[data-theme="2"]{--bg:#1a1a1e;--fg:#dcdcdc}
    html[data-theme="3"]{--bg:#1b00c8;--fg:#dcdcdc}
    html[data-theme="4"]{--bg:#0a0a0a;--fg:#4ade80}
    html[data-theme="5"]{--bg:#ffe916;--fg:#1b00c8}
    :root{--bg:#dcdcdc;--fg:#1b00c8}

    /* Reset */
    *{margin:0;padding:0;box-sizing:border-box}

    /* Base */
    html,body{
      min-height:100vh;min-height:100dvh;height:100%;
      font-size:17px;line-height:26px;
      font-family:"SF Mono",ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Monaco,Consolas,monospace;
      font-weight:400;background:var(--bg);color:var(--fg);
      -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
      -webkit-user-select:none;user-select:none;touch-action:manipulation;
    }

    .outer{width:100%;min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:flex-start;padding:40px 36px;padding-top:max(40px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
    .inner{width:100%;max-width:480px}
    .row{height:26px;width:100%}
    .row p{display:inline-block;padding-left:3px;border-radius:2px}
    .gap{height:36px}
    .dim{opacity:.45}
    .back{display:inline-block;padding:1px 4px;border-radius:2px;text-decoration:none;color:var(--fg);opacity:.45;margin-bottom:8px}
    .back:hover{opacity:1}

    /* Post rows */
    .post{display:flex;justify-content:space-between;align-items:baseline;padding:1px 4px;text-decoration:none;color:var(--fg);border-radius:2px;height:26px}
    .post:hover,.post:active,.post:focus-visible{color:var(--bg);background:var(--fg);outline:none}
    .post .date{opacity:.3;font-size:13px}

    .empty{opacity:.2;font-size:14px;padding-left:3px}
    .footer{margin-top:36px;opacity:.2;font-size:13px;padding-left:3px}

    /* Mobile */
    @media(max-width:768px){
      body{font-size:16px;line-height:28px}
      .outer{padding:28px 20px;padding-top:max(28px,env(safe-area-inset-top,0px));padding-bottom:max(28px,env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
      .row{height:28px}.post{height:auto;min-height:44px;padding:6px 4px}.gap{height:28px}
    }
    @media(max-width:380px){body{font-size:15px;line-height:26px}.outer{padding:24px 16px}}
  </style>
</head>
<body>
  <div class="outer"><div class="inner">
    <a class="back" href="https://o5102o.com">&larr; o5102o.com</a>

    <div class="row"><p>BLOG</p></div>
    <div class="row"><p class="dim">THOUGHTS, NOTES, AND LOGS</p></div>
    <div class="gap"></div>

    <!-- 포스트 추가 시:
    <a class="post" href="/blog/posts/my-post.html"><span>포스트 제목</span><span class="date">2026.03.30</span></a>
    -->
    <p class="empty">아직 글이 없습니다.</p>

    <p class="footer">&copy; 2026 o5102o</p>
  </div></div>
  <script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});</script>
</body>
</html>
