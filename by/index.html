<!DOCTYPE html>
<html lang="ko" data-theme="1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <title>by o5102o</title>
  <meta name="description" content="by o5102o — portfolio">
  <meta name="theme-color" content="#1a1a1e">
  <link rel="canonical" href="https://by.o5102o.com/">
  <meta property="og:title" content="by o5102o">
  <meta property="og:description" content="portfolio">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://by.o5102o.com/">
  <meta property="og:site_name" content="o5102o">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:image" content="https://by.o5102o.com/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <script>var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);</script>
  <style>
    /* Themes */
    html[data-theme="1"]{--bg:#1a1a1e;--fg:#dcdcdc}
    html[data-theme="2"]{--bg:#0078bf;--fg:#ff6c2f}
    html[data-theme="3"]{--bg:#f65058;--fg:#00a95c}
    html[data-theme="4"]{--bg:#925f52;--fg:#5ec8e5}
    html[data-theme="5"]{--bg:#ff48b0;--fg:#ffe916}
    :root{--bg:#1a1a1e;--fg:#dcdcdc}

    /* Reset */
    *{margin:0;padding:0;box-sizing:border-box}

    /* Base */
    html,body{
      min-height:100vh;min-height:100dvh;height:100%;
      font-size:17px;line-height:26px;
      font-family:"SF Mono",ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Monaco,Consolas,monospace;
      font-weight:400;background:var(--bg);color:var(--fg);
      -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
      -webkit-user-select:none;user-select:none;touch-action:manipulation;
    }

    .outer{width:100%;min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:flex-start;padding:40px 36px;padding-top:max(40px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
    .inner{width:100%;max-width:480px}
    .row{height:26px;width:100%}
    .row p{display:inline-block;padding-left:3px;border-radius:2px}
    .gap{height:36px}
    .dim{opacity:.45}
    .label{padding-left:3px;opacity:.45;font-size:13px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
    .back{display:inline-block;padding:1px 4px;border-radius:2px;text-decoration:none;color:var(--fg);opacity:.45;margin-bottom:8px}
    .back:hover{opacity:1}

    /* Project rows */
    .proj{display:flex;justify-content:space-between;align-items:baseline;padding:1px 4px;text-decoration:none;color:var(--fg);border-radius:2px;height:26px}
    .proj:hover,.proj:active,.proj:focus-visible{color:var(--bg);background:var(--fg);outline:none}
    .proj .meta{opacity:.3;font-size:13px}

    .status{padding-left:3px;opacity:.3;font-size:14px}
    .retry{padding:1px 4px;border:none;background:none;font:inherit;color:var(--fg);opacity:.45;font-size:13px;text-transform:uppercase;cursor:pointer}
    .retry:hover{opacity:1}
    .footer{margin-top:36px;opacity:.2;font-size:13px;padding-left:3px}

    /* Mobile */
    @media(max-width:768px){
      body{font-size:16px;line-height:28px}
      .outer{padding:28px 20px;padding-top:max(28px,env(safe-area-inset-top,0px));padding-bottom:max(28px,env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
      .row{height:28px}.proj{height:auto;min-height:44px;padding:6px 4px;flex-wrap:wrap}.gap{height:28px}
    }
    @media(max-width:380px){body{font-size:15px;line-height:26px}.outer{padding:24px 16px}}
  </style>
</head>
<body>
  <div class="outer"><div class="inner">
    <a class="back" href="https://o5102o.com">&larr; o5102o.com</a>

    <div class="row"><p>PORTFOLIO</p></div>
    <div class="row"><p class="dim">things i've built</p></div>
    <div class="gap"></div>

    <p class="label">Featured</p>
    <a class="proj" href="https://default.o5102o.com/" target="_blank" rel="noopener noreferrer"><span>Default</span><span class="meta">인터랙티브 전시</span></a>
    <div class="gap"></div>

    <p class="label">Github</p>
    <p class="status" id="status">불러오는 중...</p>
    <div id="list"></div>

    <p class="footer">&copy; 2026 o5102o</p>
  </div></div>

  <script>
    var list=document.getElementById('list'),status=document.getElementById('status');
    function rel(s){var d=new Date(s);if(isNaN(d))return'';var m=Math.floor((Date.now()-d)/60000);if(m<60)return m+'m';var h=Math.floor(m/60);if(h<24)return h+'h';var dy=Math.floor(h/24);if(dy<30)return dy+'d';return Math.floor(dy/30)+'mo'}
    async function load(){
      status.textContent='불러오는 중...';status.hidden=false;list.innerHTML='';
      try{
        var r=await fetch('https://api.github.com/users/jaylee1020/repos?sort=updated&per_page=5&type=public');
        if(!r.ok)throw new Error(r.status);var repos=await r.json();
        if(!repos.length){status.textContent='프로젝트 없음.';return}
        status.hidden=true;
        repos.forEach(function(repo){
          var a=document.createElement('a');a.className='proj';a.href=repo.html_url;a.target='_blank';a.rel='noopener noreferrer';
          var name=document.createElement('span');name.textContent=repo.name;
          var meta=document.createElement('span');meta.className='meta';
          meta.textContent=(repo.language||'')+(repo.language?' · ':'')+rel(repo.updated_at);
          a.append(name,meta);list.appendChild(a);
        });
      }catch(e){status.textContent='불러오기 실패. ';var btn=document.createElement('button');btn.className='retry';btn.textContent='[다시 시도]';btn.addEventListener('click',load);status.appendChild(btn)}
    }
    load();
    if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
  </script>
</body>
</html>
