<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <title>o5102o / card</title>
  <meta name="description" content="o5102o — developer card &amp; contact">
  <meta name="theme-color" content="#1a1a1e">
  <link rel="canonical" href="https://card.o5102o.com/">
  <meta property="og:title" content="o5102o / card">
  <meta property="og:description" content="developer card + contact">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://card.o5102o.com/">
  <meta property="og:site_name" content="o5102o">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:image" content="https://card.o5102o.com/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/shared/base.css">
  <style>
    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
      padding-left: 3px;
      font-size: 13px;
      letter-spacing: 0.08em;
      opacity: 0.45;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 6px 3px;
      border: none;
      border-bottom: 1px solid rgba(220, 220, 220, 0.15);
      border-radius: 0;
      background: transparent;
      color: var(--fg);
      font-size: 15px;
      -webkit-user-select: text;
      user-select: text;
      outline: none;
    }

    input:focus {
      border-bottom-color: var(--fg);
    }

    input::placeholder {
      color: rgba(220, 220, 220, 0.2);
    }

    input.invalid {
      border-bottom-color: #f87171;
    }

    .msg {
      min-height: 1.2em;
      margin-top: 10px;
      padding-left: 3px;
      font-size: 14px;
    }

    .msg.error {
      color: #f87171;
    }

    .msg.ok {
      color: #4ade80;
    }

    .msg a {
      color: #4ade80;
      text-decoration: underline;
    }

    .submit {
      margin-top: 14px;
    }

    .submit:disabled {
      cursor: not-allowed;
      opacity: 0.3;
    }

    .done {
      display: none;
      margin-top: 14px;
      padding-left: 3px;
      font-size: 14px;
      opacity: 0.45;
    }

    .done.visible {
      display: block;
    }

    .inline-button {
      padding: 0 2px;
      border: none;
      background: none;
      color: inherit;
      cursor: pointer;
      text-decoration: underline;
    }

    .inline-button:hover,
    .inline-button:focus-visible {
      opacity: 1;
      outline: none;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    .shake {
      animation: shake 0.35s ease-out;
    }

    @media only screen and (max-width:768px) {
      input {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="outer">
    <section class="inner">
      <a class="back" href="https://o5102o.com">&larr; o5102o.com</a>

      <div class="row"><p>JOOYOUNG LEE</p></div>
      <div class="row"><p class="dim">컴퓨터공학부 2학년</p></div>
      <div class="gap"></div>

      <a class="list-row" href="mailto:jyounglee1020@gmail.com">
        <span>Email</span>
        <span class="meta">jyounglee1020@gmail.com</span>
      </a>
      <div class="gap"></div>

      <button class="menu-row" id="vcardBtn" type="button">
        <span class="btn-label">연락처에 저장</span>
        <span class="mobile-only">[+]</span>
      </button>
      <div class="gap"></div>

      <div class="row"><p>연락처 남기기</p></div>
      <form id="form" aria-busy="false" novalidate>
        <label for="name">이름 *</label>
        <input id="name" name="name" placeholder="홍길동" autocomplete="name" required maxlength="40" enterkeyhint="next">

        <label for="phone">전화번호</label>
        <input id="phone" name="phone" type="tel" placeholder="010-0000-0000" inputmode="tel" autocomplete="tel" maxlength="20" enterkeyhint="next">

        <label for="place">만난 곳</label>
        <input id="place" name="place" placeholder="해커톤" autocomplete="off" maxlength="60" enterkeyhint="send">

        <p id="msg" class="msg" role="status" aria-live="polite"></p>

        <button id="sub" class="menu-row submit" type="submit">
          <span class="btn-label">보내기</span>
        </button>

        <p class="done" id="done">
          감사합니다.
          <button class="inline-button" type="button" id="vcardBtn2">연락처에 저장</button>
        </p>
      </form>
    </section>
  </main>
  <script type="module" src="/shared/card.js"></script>
</body>
</html>
