<!DOCTYPE html>
<html lang="ko" data-theme="3">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preload" href="/site.js" as="script">
  <title>CARD</title>
  <meta name="description" content="JOOYOUNG LEE — DEVELOPER CARD &amp; CONTACT">
  <meta name="theme-color" content="#1b00c8">
  <link rel="canonical" href="https://card.o5102o.com/">
  <meta property="og:title" content="CARD">
  <meta property="og:description" content="DEVELOPER CARD + CONTACT">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://card.o5102o.com/">
  <meta property="og:site_name" content="JOOYOUNG LEE">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:image" content="https://card.o5102o.com/icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
  <script>var t=new URLSearchParams(location.search).get('t')||localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);</script>
  <style>
    /* Themes */
    html[data-theme="2"]{--bg:#1a1a1e;--fg:#dcdcdc}
    html[data-theme="3"]{--bg:#1b00c8;--fg:#dcdcdc}
    html[data-theme="4"]{--bg:#0a0a0a;--fg:#4ade80}
    html[data-theme="5"]{--bg:#ffe916;--fg:#1b00c8}
    :root{--bg:#1b00c8;--fg:#dcdcdc;--copy-text:" [+]"}

    /* Reset */
    *{margin:0;padding:0;box-sizing:border-box}
    button{border:none;background:none;font:inherit;color:inherit;cursor:default}

    /* Base */
    html,body{
      min-height:100vh;min-height:100dvh;height:100%;
      font-size:17px;line-height:26px;
      font-family:"SF Mono",ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Monaco,Consolas,monospace;
      font-weight:400;background:var(--bg);color:var(--fg);
      -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
      -webkit-user-select:none;user-select:none;touch-action:manipulation;
    }

    .mobile-only{display:none}
    .outer{width:100%;min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:flex-start;padding:40px 36px;padding-top:max(40px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
    .inner{width:100%;max-width:480px}
    .row{height:26px;width:100%}
    .row p{display:inline-block;padding-left:3px;border-radius:2px}
    .gap{height:36px}
    .dim{opacity:.45}
    .back{display:inline-block;padding:1px 4px;border-radius:2px;text-decoration:none;color:var(--fg);opacity:.45;margin-bottom:8px}
    .back:hover{opacity:1}

    /* Info rows */
    .info{display:flex;justify-content:space-between;padding:1px 4px;text-decoration:none;color:var(--fg);border-radius:2px;height:26px;align-items:baseline}
    .info span:last-child{opacity:.45}
    .info:hover,.info:active,.info:focus-visible{color:var(--bg);background:var(--fg);outline:none}

    /* Buttons */
    .link:hover::after,.link:active::after,.link:focus-visible::after{display:inline;content:" [↗]"}
    .copy:hover::after,.copy:active::after,.copy:focus-visible::after{display:inline;content:var(--copy-text)}
    button{padding:1px 4px;border-radius:2px;text-transform:uppercase;white-space:nowrap;outline:none}
    button:focus-visible{color:var(--bg);background:var(--fg)}
    button:active{color:var(--bg);background:var(--fg)}

    /* Form */
    label{display:block;padding-left:3px;opacity:.45;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin-top:12px;margin-bottom:4px}
    input{width:100%;background:transparent;border:none;border-bottom:1px solid color-mix(in srgb,var(--fg) 15%,transparent);color:var(--fg);padding:6px 3px;font:inherit;font-size:15px;-webkit-user-select:text;user-select:text;outline:none;border-radius:0}
    input:focus{border-bottom-color:var(--fg)}
    input::placeholder{color:color-mix(in srgb,var(--fg) 25%,transparent)}
    input.invalid{border-bottom-color:#f87171}
    .msg{padding-left:3px;font-size:14px;min-height:1.2em;margin-top:10px}
    .msg.error{color:#f87171}
    .msg.ok{color:#4ade80}
    .msg a{color:#4ade80;text-decoration:underline}
    .submit{margin-top:14px;padding:1px 4px;border-radius:2px;text-transform:uppercase;white-space:nowrap;outline:none}
    .submit:disabled{opacity:.3;cursor:not-allowed}
    .done{display:none;margin-top:14px;opacity:.45;font-size:14px;padding-left:3px}
    .done.visible{display:block}
    .done button{display:inline;padding:0 2px}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
    .shake{animation:shake .35s ease-out}

    /* Mobile */
    @media(max-width:768px){
      body{font-size:16px;line-height:28px}.mobile-only{display:block}
      .outer{padding:28px 20px;padding-top:max(28px,env(safe-area-inset-top,0px));padding-bottom:max(28px,env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
      .row,.info{height:28px}.gap{height:28px}
      button{padding:3px;font-size:16px;line-height:28px;width:100%;display:flex;min-height:44px;align-items:center}
      .btn-label{flex-grow:1;text-align:left}
      .link::after,.copy::after{content:""!important}
      input{font-size:16px}
    }
    @media(max-width:380px){body{font-size:15px;line-height:26px}.outer{padding:24px 16px}}
  </style>
</head>
<body>
  <div class="outer"><div class="inner">
    <a class="back" href="https://o5102o.com">&larr; o5102o.com</a>

    <div class="row"><p>JOOYOUNG LEE</p></div>
    <div class="row"><p class="dim">건국대학교 컴퓨터공학부</p></div>
    <div class="gap"></div>

    <a class="info" href="mailto:jyounglee1020@gmail.com"><span>Email</span><span>jyounglee1020@gmail.com</span></a>
    <a class="info" href="tel:010-8520-7201"><span>Phone</span><span>010-8520-7201</span></a>
    <a class="info" href="https://github.com/jaylee1020" target="_blank" rel="noopener noreferrer"><span>Github</span><span>@jaylee1020</span></a>
    <a class="info" href="https://www.instagram.com/eeooyoung" target="_blank" rel="noopener noreferrer"><span>Instagram</span><span>@eeooyoung</span></a>
    <div class="gap"></div>

    <div class="row"><button class="link" id="vcardBtn"><span class="btn-label">연락처에 저장</span><span class="mobile-only">[+]</span></button></div>
    <div class="gap"></div>

    <div class="row"><p>연락처 남기기</p></div>
    <form id="form" aria-busy="false">
      <label for="name">이름 *</label>
      <input id="name" name="name" placeholder="홍길동" autocomplete="name" required maxlength="40" enterkeyhint="next" aria-describedby="msg"/>
      <label for="phone">전화번호 *</label>
      <input id="phone" name="phone" type="tel" placeholder="010-0000-0000" inputmode="tel" autocomplete="tel" required maxlength="20" enterkeyhint="next" aria-describedby="msg"/>
      <label for="place">만난 곳</label>
      <input id="place" name="place" placeholder="해커톤" autocomplete="off" maxlength="60" enterkeyhint="send"/>
      <p id="msg" class="msg" role="status" aria-live="polite"></p>
      <button id="sub" class="submit" type="submit">보내기</button>
      <p class="done" id="done">감사합니다. <button type="button" id="vcardBtn2">연락처에 저장</button></p>
    </form>
  </div></div>

  <script src="/site.js"></script>
  <script>
    const site = window.o5102oSite;
    const VCARD_LINES = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:이;주영;;;',
      'FN:이주영 (JOOYOUNG LEE)',
      'NICKNAME:o5102o',
      'TITLE:Designer & Developer',
      'TEL;TYPE=CELL:010-8520-7201',
      'EMAIL;TYPE=INTERNET:jyounglee1020@gmail.com',
      'URL:https://o5102o.com',
      'X-SOCIALPROFILE;TYPE=instagram:https://www.instagram.com/eeooyoung',
      'X-SOCIALPROFILE;TYPE=github:https://github.com/jaylee1020',
      'NOTE:o5102o.com',
      'END:VCARD',
    ];
    const PHONE_PATTERN = /^(01[016789]\d{7,8}|0[2-6][1-9]\d{6,7}|\+82\d{9,10})$/;
    const CONTACT_ENDPOINT = '/api/contact';

    function downloadVCard() {
      const blob = new Blob([VCARD_LINES.join('\r\n')], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = 'o5102o.vcf';
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
    }

    document.getElementById('vcardBtn').addEventListener('click', downloadVCard);
    document.getElementById('vcardBtn2').addEventListener('click', downloadVCard);

    const form = document.getElementById('form');
    const nameInput = document.getElementById('name');
    const phoneInput = document.getElementById('phone');
    const placeInput = document.getElementById('place');
    const message = document.getElementById('msg');
    const submitButton = document.getElementById('sub');
    const doneMessage = document.getElementById('done');
    let isSubmitting = false;

    function setMessage(text, tone) {
      message.textContent = text || '';
      message.className = 'msg' + (tone ? ' ' + tone : '');
    }

    function formatPhoneNumber(value) {
      const digits = value.replace(/\D/g, '');
      if (digits.length <= 3) return digits;
      if (digits.length <= 7) return digits.slice(0, 3) + '-' + digits.slice(3);
      return digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7, 11);
    }

    function shakeField(field) {
      field.classList.add('invalid', 'shake');
      field.addEventListener('animationend', function () {
        field.classList.remove('shake');
      }, { once: true });
    }

    function clearValidation(field) {
      field.classList.remove('invalid');
      setMessage('');
    }

    function createPayload() {
      return {
        name: nameInput.value.trim(),
        phone: phoneInput.value.trim(),
        place: placeInput.value.trim() || null,
        source: 'card.o5102o.com',
        createdAt: new Date().toISOString(),
      };
    }

    function getPhoneDigits(value) {
      return value.replace(/[\s\-()]/g, '');
    }

    function renderFallbackMailLink(payload) {
      const subject = encodeURIComponent('[card] ' + payload.name);
      const body = encodeURIComponent(
        '이름: ' + payload.name + '\n전화번호: ' + (payload.phone || '-') + '\n만난 곳: ' + (payload.place || '-')
      );

      message.innerHTML = '';
      message.append('서버 오류. ');

      const link = document.createElement('a');
      link.href = 'mailto:jyounglee1020@gmail.com?subject=' + subject + '&body=' + body;
      link.textContent = '이메일로 보내기';
      message.appendChild(link);
      message.className = 'msg error';
    }

    phoneInput.addEventListener('input', function () {
      const cursor = phoneInput.selectionStart;
      const before = phoneInput.value;
      const formatted = formatPhoneNumber(before);

      if (formatted !== before) {
        const delta = formatted.length - before.length;
        phoneInput.value = formatted;
        phoneInput.setSelectionRange(cursor + delta, cursor + delta);
      }

      clearValidation(phoneInput);
    });

    nameInput.addEventListener('input', function () {
      clearValidation(nameInput);
    });

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      if (isSubmitting) {
        return;
      }

      const payload = createPayload();

      if (!payload.name) {
        shakeField(nameInput);
        setMessage('이름을 입력해 주세요.', 'error');
        nameInput.focus();
        return;
      }

      if (!payload.phone) {
        shakeField(phoneInput);
        setMessage('전화번호를 입력해 주세요.', 'error');
        phoneInput.focus();
        return;
      }

      if (!PHONE_PATTERN.test(getPhoneDigits(payload.phone))) {
        shakeField(phoneInput);
        setMessage('전화번호 형식이 맞지 않습니다.', 'error');
        phoneInput.focus();
        return;
      }

      try {
        isSubmitting = true;
        submitButton.disabled = true;
        submitButton.textContent = '저장 중...';
        setMessage('', 'ok');

        const response = await fetch(CONTACT_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          throw new Error(String(response.status));
        }

        setMessage('저장 완료.', 'ok');
        form.reset();
        doneMessage.classList.add('visible');
      } catch (_error) {
        renderFallbackMailLink(payload);
      } finally {
        isSubmitting = false;
        submitButton.disabled = false;
        submitButton.textContent = '보내기';
      }
    });

    site.updateBackLink('.back');
    site.registerServiceWorker('/sw.js');
  </script>
</body>
</html>
