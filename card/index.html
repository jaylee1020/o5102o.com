<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="o5102o card">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <title>o5102o / card</title>
  <meta name="description" content="o5102o — developer card &amp; contact">
  <meta name="theme-color" content="#1a1a1e">
  <link rel="canonical" href="https://card.o5102o.com/">
  <meta property="og:title" content="o5102o / card">
  <meta property="og:description" content="developer card + contact">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://card.o5102o.com/">
  <meta property="og:site_name" content="o5102o">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:image" content="https://card.o5102o.com/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="o5102o / card">
  <meta name="twitter:description" content="developer card + contact">
  <meta name="twitter:image" content="https://card.o5102o.com/og-image.svg">
  <style>
    :root{--bg:#1a1a1e;--fg:#dcdcdc;--dim-fg:rgba(220,220,220,0.45);--copy-text:" [+]"}
    *{margin:0;padding:0;box-sizing:border-box}
    body{line-height:1}
    button{border:none;background:none;font:inherit;color:inherit;cursor:default}
    html,body{
      min-height:100vh;min-height:100dvh;height:100%;
      font-size:17px;line-height:26px;
      font-family:"SF Mono",ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Monaco,Consolas,monospace;
      font-weight:400;background:var(--bg);color:var(--fg);
      -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
      -webkit-user-select:none;user-select:none;touch-action:manipulation;
    }
    .mobile-only{display:none}
    .outer{
      width:100%;min-height:100vh;min-height:100dvh;
      display:flex;align-items:flex-start;justify-content:flex-start;
      padding:40px 36px;
      padding-top:max(40px,env(safe-area-inset-top,0px));
      padding-bottom:max(40px,env(safe-area-inset-bottom,0px));
    }
    .inner{width:100%;max-width:480px}
    .row{height:26px;width:100%}
    .row p{display:inline-block;padding-left:3px;border-radius:2px}
    .section-gap{height:36px}
    .dim{opacity:.45}

    /* Profile links */
    .profile-row{height:26px;width:100%}
    .profile-row a{
      display:flex;justify-content:space-between;
      padding:1px 4px;text-decoration:none;color:var(--fg);
      border-radius:2px;white-space:nowrap;
    }
    .profile-row a span:last-child{opacity:.45}
    .profile-row a:hover{color:var(--bg);background:var(--fg)}
    .profile-row a:focus-visible{color:var(--bg);background:var(--fg);outline:none}

    /* Buttons */
    .link:focus-visible::after,.link:hover::after,.link:active::after{display:inline;content:" [↗]"}
    .copy:focus-visible::after,.copy:hover::after,.copy:active::after{display:inline;content:var(--copy-text)}
    button{padding:1px 4px;border-radius:2px;text-transform:uppercase;white-space:nowrap;outline:none}
    button:focus-visible{color:var(--bg);background:var(--fg)}
    button:active{color:var(--bg);background:var(--fg)}

    /* Form */
    .form-section{margin-top:8px}
    label{display:block;height:26px;padding-left:3px;opacity:.45;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
    input{
      width:100%;background:transparent;border:1px solid rgba(220,220,220,0.2);
      color:var(--fg);padding:8px 10px;border-radius:2px;
      font:inherit;font-size:15px;margin-bottom:4px;
      -webkit-user-select:text;user-select:text;
    }
    input:focus{outline:none;border-color:var(--fg)}
    input::placeholder{color:rgba(220,220,220,0.25)}
    input.invalid{border-color:#f87171}
    .hint{padding-left:3px;opacity:.3;font-size:12px;margin-top:4px}
    .msg{padding-left:3px;font-size:14px;min-height:1.2em;margin-top:8px}
    .msg.error{color:#f87171}
    .msg.ok{color:#4ade80}
    .msg a{color:#4ade80;text-decoration:underline}
    .submit-btn{
      margin-top:12px;width:100%;padding:10px;
      border:1px solid var(--fg);border-radius:2px;
      background:var(--fg);color:var(--bg);
      font:inherit;font-size:14px;font-weight:400;
      text-transform:uppercase;letter-spacing:.06em;cursor:pointer;
    }
    .submit-btn:hover{opacity:.9}
    .submit-btn:active{opacity:.8}
    .submit-btn:disabled{opacity:.3;cursor:not-allowed}
    .success-prompt{
      display:none;margin-top:12px;padding:10px;
      border:1px solid rgba(220,220,220,0.2);border-radius:2px;
      text-align:center;font-size:14px;
    }
    .success-prompt.visible{display:block}
    .success-prompt button{display:inline;padding:1px 4px;text-transform:uppercase}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
    .shake{animation:shake .35s ease-out}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid transparent;border-top-color:var(--bg);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}

    /* Back link */
    .back{display:inline-block;padding:1px 4px;border-radius:2px;text-decoration:none;color:var(--fg);opacity:.45;margin-bottom:8px}
    .back:hover{opacity:1}
    .back:focus-visible{opacity:1;color:var(--bg);background:var(--fg);outline:none}

    @media only screen and (max-width:768px){
      body{font-size:16px;line-height:28px}
      .mobile-only{display:block}
      button.mobile-only{display:flex}
      .outer{
        padding:28px 20px;
        padding-top:max(28px,env(safe-area-inset-top,0px));
        padding-bottom:max(28px,env(safe-area-inset-bottom,0px));
        padding-left:max(20px,env(safe-area-inset-left,0px));
        padding-right:max(20px,env(safe-area-inset-right,0px));
      }
      .row{height:28px}
      .profile-row{height:28px}
      .profile-row a{font-size:16px}
      .section-gap{height:28px}
      button,.nolink{padding:3px;font-size:16px;line-height:28px;width:100%;display:flex;min-height:44px;align-items:center}
      .btn-label{flex-grow:1;text-align:left}
      .link::after,.copy::after{content:""!important}
      input{font-size:16px}
    }
    @media only screen and (max-width:380px){
      body{font-size:15px;line-height:26px}
      .outer{padding:24px 16px}
      .row{height:26px}
      button,.nolink{font-size:15px;line-height:26px}
    }
  </style>
</head>
<body>
  <div class="outer">
    <div class="inner">
      <a class="back" href="https://o5102o.com">&larr; o5102o.com</a>

      <div class="row"><p>CARD</p></div>
      <div class="row"><p class="dim">JOOYOUNG LEE &middot; 컴퓨터공학부 2학년</p></div>
      <div class="section-gap"></div>

      <div class="profile-row"><a href="https://o5102o.com"><span>WEB</span><span>o5102o.com</span></a></div>
      <div class="profile-row"><a href="https://by.o5102o.com" target="_blank" rel="noopener noreferrer"><span>PORTFOLIO</span><span>by.o5102o.com</span></a></div>
      <div class="profile-row"><a href="https://github.com/jaylee1020" target="_blank" rel="noopener noreferrer"><span>GITHUB</span><span>@jaylee1020</span></a></div>
      <div class="profile-row"><a href="mailto:jyounglee1020@gmail.com"><span>EMAIL</span><span>jyounglee1020@gmail.com</span></a></div>
      <div class="profile-row"><a href="https://www.instagram.com/o5102o" target="_blank" rel="noopener noreferrer"><span>INSTAGRAM</span><span>@o5102o</span></a></div>
      <div class="section-gap"></div>

      <div class="row"><p>연락처 저장</p></div>
      <div style="margin-top:8px">
        <button class="link" id="vcardBtn">
          <span class="btn-label">연락처에 저장</span>
          <span class="mobile-only">[+]</span>
        </button>
      </div>
      <div>
        <button class="link" id="walletBtn" hidden>
          <span class="btn-label">Apple Wallet에 추가</span>
          <span class="mobile-only">[+]</span>
        </button>
      </div>
      <div class="row"><p id="saveNote" class="dim" style="font-size:13px"></p></div>
      <div class="section-gap"></div>

      <div class="row"><p>연락처 남기기</p></div>
      <form id="contactForm" class="form-section" aria-busy="false">
        <label for="name">이름 *</label>
        <input id="name" name="name" placeholder="홍길동" autocomplete="name" required aria-invalid="false" maxlength="40" enterkeyhint="next" />
        <label for="phone">전화번호 (선택)</label>
        <input id="phone" name="phone" type="tel" placeholder="010-0000-0000" inputmode="tel" autocomplete="tel" aria-invalid="false" maxlength="20" enterkeyhint="next" />
        <label for="place">만난 곳 (선택)</label>
        <input id="place" name="place" placeholder="예: 해커톤" autocomplete="off" maxlength="60" enterkeyhint="send" />
        <p class="hint">* API 미연결 시 이메일로 전환됩니다.</p>
        <p id="message" class="msg" role="status" aria-live="polite" aria-atomic="true"></p>
        <button id="submitButton" class="submit-btn" type="submit">보내기</button>
        <div class="success-prompt" id="successPrompt">
          <p>감사합니다! 제 연락처도 저장해 가세요.</p>
          <button type="button" id="promptVcardBtn">연락처에 저장</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(navigator.userAgent);
    var walletBtn = document.getElementById('walletBtn');
    var saveNote = document.getElementById('saveNote');
    function setSaveNote(t) { saveNote.textContent = t || ''; }

    function generateVCard() {
      var vcard = ['BEGIN:VCARD','VERSION:3.0','N:LEE;JOOYOUNG;;;','FN:JOOYOUNG LEE','NICKNAME:o5102o','TITLE:Designer & Developer','EMAIL;TYPE=INTERNET:jyounglee1020@gmail.com','URL:https://o5102o.com','X-SOCIALPROFILE;TYPE=instagram:https://www.instagram.com/o5102o','X-SOCIALPROFILE;TYPE=github:https://github.com/jaylee1020','NOTE:o5102o.com - JOOYOUNG LEE - Designer & Developer','END:VCARD'].join('\r\n');
      var blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = 'o5102o.vcf';
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }
    document.getElementById('vcardBtn').addEventListener('click', generateVCard);
    document.getElementById('promptVcardBtn').addEventListener('click', generateVCard);

    var WALLET_PASS_URL = '/api/wallet';
    async function initWalletButton() {
      if (!isIOS) { setSaveNote(isAndroid ? '연락처 파일(.vcf)이 다운로드되면 연락처 앱에서 열어 저장할 수 있습니다.' : ''); return; }
      try { var res = await fetch(WALLET_PASS_URL, { method: 'HEAD' }); if (res.ok) { walletBtn.hidden = false; setSaveNote('Apple Wallet 또는 연락처 저장 중 편한 방법을 선택하세요.'); } else { setSaveNote('현재 Wallet 패스는 준비 중입니다.'); } } catch(e) { setSaveNote('현재 Wallet 패스는 준비 중입니다.'); }
    }
    if ('requestIdleCallback' in window) requestIdleCallback(initWalletButton); else setTimeout(initWalletButton, 0);

    var contactForm = document.getElementById('contactForm');
    var nameInput = document.getElementById('name');
    var phoneInput = document.getElementById('phone');
    var placeInput = document.getElementById('place');
    var messageEl = document.getElementById('message');
    var submitButton = document.getElementById('submitButton');
    var successPrompt = document.getElementById('successPrompt');
    var isSubmitting = false;

    function setMessage(t, type) { messageEl.textContent = t || ''; messageEl.className = 'msg' + (type ? ' ' + type : ''); }
    function clearFieldError(f) { f.classList.remove('invalid','shake'); f.setAttribute('aria-invalid','false'); }
    function shakeField(f) { f.classList.add('invalid','shake'); f.setAttribute('aria-invalid','true'); f.addEventListener('animationend', function() { f.classList.remove('shake'); }, { once: true }); }
    function setSubmitting(v) { isSubmitting = v; submitButton.disabled = v; submitButton.innerHTML = v ? '<span class="spinner"></span>저장 중...' : '보내기'; contactForm.setAttribute('aria-busy', v ? 'true' : 'false'); }
    function formatPhone(v) { var d = v.replace(/\D/g, ''); if (d.length <= 3) return d; if (d.length <= 7) return d.slice(0,3)+'-'+d.slice(3); return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7,11); }

    phoneInput.addEventListener('input', function() { var p = phoneInput.selectionStart, b = phoneInput.value, f = formatPhone(b); if (f !== b) { phoneInput.value = f; phoneInput.setSelectionRange(p + f.length - b.length, p + f.length - b.length); } clearFieldError(phoneInput); setMessage(''); });
    nameInput.addEventListener('input', function() { clearFieldError(nameInput); setMessage(''); });
    placeInput.addEventListener('input', function() { setMessage(''); });

    contactForm.addEventListener('submit', async function(e) {
      e.preventDefault(); if (isSubmitting) return;
      var payload = { name: nameInput.value.trim(), phone: phoneInput.value.trim() || null, place: placeInput.value.trim() || null, source: 'card.o5102o.com', createdAt: new Date().toISOString() };
      if (!payload.name) { shakeField(nameInput); setMessage('이름을 입력해 주세요.','error'); nameInput.focus(); return; }
      if (payload.phone) { var digits = payload.phone.replace(/[\s\-()]/g,''); if (!/^(01[016789]\d{7,8}|0[2-6][1-9]\d{6,7}|\+82\d{9,10})$/.test(digits)) { shakeField(phoneInput); setMessage('전화번호 형식이 맞지 않습니다.','error'); phoneInput.focus(); return; } }
      try {
        setSubmitting(true); setMessage('연락처를 저장하고 있어요...','ok');
        var res = await fetch('/api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        setMessage('저장이 완료되었습니다.','ok'); contactForm.reset(); successPrompt.classList.add('visible');
      } catch(err) {
        var subj = encodeURIComponent('[card.o5102o.com] ' + payload.name + '님의 연락처');
        var body = encodeURIComponent('이름: '+payload.name+'\n전화번호: '+(payload.phone||'미입력')+'\n만난 곳: '+(payload.place||'미입력'));
        messageEl.innerHTML = ''; messageEl.append('서버 저장이 어려워 이메일로 전환합니다. ');
        var link = document.createElement('a'); link.href = 'mailto:jyounglee1020@gmail.com?subject='+subj+'&body='+body; link.textContent = '이메일 앱에서 보내기';
        messageEl.appendChild(link); messageEl.className = 'msg error';
      } finally { setSubmitting(false); }
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){});
  </script>
</body>
</html>
