<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>o5102o</title>
  <meta name="description" content="이주영(Jay) — designer · developer">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)">
  <link rel="canonical" href="https://o5102o.com/">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <meta property="og:title" content="o5102o">
  <meta property="og:description" content="이주영(Jay) — designer · developer">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://o5102o.com/">
  <meta property="og:site_name" content="o5102o">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:image" content="https://o5102o.com/og-image.svg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="o5102o">
  <meta name="twitter:description" content="이주영(Jay) — designer · developer">
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #e8e8e8;
      --dim: rgba(255, 255, 255, 0.12);
      --dim-hover: rgba(255, 255, 255, 0.4);
      --sub: rgba(255, 255, 255, 0.5);
      --muted: rgba(255, 255, 255, 0.25);
      --subtle: rgba(255, 255, 255, 0.35);
      --hover-bg: rgba(255, 255, 255, 0.04);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f7f7;
        --fg: #111;
        --dim: rgba(0, 0, 0, 0.1);
        --dim-hover: rgba(0, 0, 0, 0.3);
        --sub: rgba(0, 0, 0, 0.45);
        --muted: rgba(0, 0, 0, 0.25);
        --subtle: rgba(0, 0, 0, 0.35);
        --hover-bg: rgba(0, 0, 0, 0.03);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: "D2Coding", "Nanum Gothic Coding", "Noto Sans Mono CJK KR", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .hub {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 0.35rem;
    }

    .desc {
      font-size: 0.8rem;
      color: var(--sub);
      margin-bottom: 2.5rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      list-style: none;
    }

    .links a {
      display: block;
      padding: 0.9rem 1rem;
      border: 1px solid var(--dim);
      color: var(--fg);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      transition: border-color 0.2s, background 0.2s;
    }

    .links a:hover,
    .links a:focus-visible {
      border-color: var(--dim-hover);
      background: var(--hover-bg);
      outline: none;
    }

    .links .label {
      display: block;
      font-weight: 600;
    }

    .links .sub {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.72rem;
      color: var(--sub);
    }

    footer {
      margin-top: 3rem;
      font-size: 0.7rem;
      color: var(--muted);
    }

    footer a {
      color: var(--subtle);
      text-decoration: none;
    }

    footer a:hover { color: var(--sub); }

    @media (prefers-reduced-motion: reduce) {
      .links a { transition: none; }
    }
  </style>
</head>
<body>
  <main class="hub">
    <h1>o5102o</h1>
    <p class="desc">이주영(Jay) — designer · developer</p>
    <nav>
      <ul class="links">
        <li>
          <a href="https://card.o5102o.com/">
            <span class="label">Card</span>
            <span class="sub">developer card + contact</span>
          </a>
        </li>
        <li>
          <a href="https://by.o5102o.com/">
            <span class="label">Portfolio</span>
            <span class="sub">by o5102o</span>
          </a>
        </li>
        <li>
          <a href="https://default.o5102o.com/">
            <span class="label">Default 전시</span>
            <span class="sub">Opt-out</span>
          </a>
        </li>
      </ul>
    </nav>
  </main>
  <footer>
    <a href="https://github.com/jaylee1020" target="_blank" rel="noopener noreferrer">github</a>
  </footer>
</body>
</html>
