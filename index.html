  <style>
    /* Themes */
    html[data-theme="2"]{--bg:#1a1a1e;--fg:#dcdcdc}
    html[data-theme="3"]{--bg:#1b00c8;--fg:#dcdcdc}
    html[data-theme="4"]{--bg:#0a0a0a;--fg:#4ade80}
    html[data-theme="5"]{--bg:#ffe916;--fg:#1b00c8}
    :root{--bg:#1b00c8;--fg:#dcdcdc;--copy-text:" [+]"}

    /* Reset */
    *{margin:0;padding:0;box-sizing:border-box}
    button{border:none;background:none;font:inherit;color:inherit;cursor:default}

    /* Base */
    html,body{
      min-height:100vh;min-height:100dvh;height:100%;
      font-size:17px;line-height:26px;
      font-family:"SF Mono",ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Monaco,Consolas,monospace;
      font-weight:400;background:var(--bg);color:var(--fg);
      -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
      -webkit-user-select:none;user-select:none;touch-action:manipulation;
    }

    .mobile-only{display:none}

    /* Layout */
    .outer{
      width:100%;min-height:100vh;min-height:100dvh;
      display:flex;align-items:flex-start;justify-content:flex-start;
      padding:40px 36px;
      padding-top:max(40px,env(safe-area-inset-top,0px));
      padding-bottom:max(40px,env(safe-area-inset-bottom,0px));
    }
    .inner{width:100%;max-width:480px}

    /* Rows */
    .row{height:26px;width:100%}
    .row p{display:inline-block;padding-left:3px;border-radius:2px}
    .gap{height:36px}
    .dim{opacity:.45}

    /* Hover indicators */
    .link:hover::after,.link:active::after,.link:focus-visible::after{display:inline;content:" [↗]"}
    .copy:hover::after,.copy:active::after,.copy:focus-visible::after{display:inline;content:var(--copy-text)}

    /* Buttons & link rows (anchors styled like buttons) */
    .btn{display:inline-block;padding:1px 4px;border-radius:2px;text-transform:uppercase;white-space:nowrap;outline:none;text-decoration:none;color:var(--fg)}
    .btn:focus-visible,.btn:active{color:var(--bg);background:var(--fg)}
    .theme-row{margin-top:32px}
    .kbd-hint{display:none;margin-top:24px}
    .kbd-hint p{opacity:.25;font-size:13px}
    @media(hover:hover) and (pointer:fine){.kbd-hint{display:block}}

    /* Mobile */
    @media(max-width:768px){
      body{font-size:16px;line-height:28px}
      .mobile-only{display:block}
      .outer{padding:28px 20px;padding-top:max(28px,env(safe-area-inset-top,0px));padding-bottom:max(28px,env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
      .row{height:28px}
      .gap{height:28px}
      .btn{padding:3px;font-size:16px;line-height:28px;width:100%;display:flex;min-height:44px;align-items:center}
      .btn-label{flex-grow:1;text-align:left}
      .link::after,.copy::after{content:""!important}
      .theme-row{margin-top:26px}
    }
    @media(max-width:380px){body{font-size:15px;line-height:26px}.outer{padding:24px 16px}.row{height:26px}.btn{font-size:15px;line-height:26px}}
    @media(max-height:500px){.outer{padding-top:20px;padding-bottom:20px}.gap{height:16px}.theme-row{margin-top:16px}}
    @media(prefers-reduced-motion:reduce){.intro-line{opacity:1!important;transform:none!important;transition:none!important}.cursor{animation:none!important}}

    /* Typing */
    .intro-line{opacity:0;transform:translateX(-2px);transition:opacity .3s,transform .3s ease}
    .intro-line.visible{opacity:1;transform:translateX(0)}
    .cursor{display:inline-block;width:1px;height:1em;background:var(--fg);margin-left:1px;vertical-align:text-bottom;animation:blink .7s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <script src="/site.js"></script>
  <script>
    const site = window.o5102oSite;

    // Keep ?t= on internal links so the current theme follows across subdomains.
    function syncThemedLinks() {
      document.querySelectorAll('a[data-themed]').forEach(function (anchor) {
        anchor.href = site.buildThemedUrl(anchor.href);
      });
    }
    syncThemedLinks();

    const emailButton = document.getElementById('email-btn');
    const emailMobileLabel = emailButton.querySelector('.mobile-only');
    let copyResetTimer = null;

    function setCopyIndicator(label) {
      document.documentElement.style.setProperty('--copy-text', '"' + label + '"');
      if (emailMobileLabel) {
        emailMobileLabel.textContent = label.trim();
      }
    }

    async function copyEmail() {
      const copied = await site.copyText('jyounglee1020@gmail.com').catch(function () {
        return false;
      });

      if (!copied) {
        window.location.href = 'mailto:jyounglee1020@gmail.com';
        return;
      }

      setCopyIndicator(' [COPIED]');
      window.clearTimeout(copyResetTimer);
      copyResetTimer = window.setTimeout(function () {
        setCopyIndicator(' [+]');
      }, 2000);
    }

    function nextTheme() {
      site.cycleTheme(2, 5);
      syncThemedLinks();
    }

    emailButton.addEventListener('click', copyEmail);
    document.getElementById('theme-btn').addEventListener('click', nextTheme);

    // Keyboard shortcuts (desktop): jump rows without the mouse.
    const keyTargets = {
      c: 'l-card',
      p: 'l-portfolio',
      b: 'l-blog',
      d: 'l-exhibit',
      g: 'l-github',
      i: 'l-instagram',
    };

    document.addEventListener('keydown', function (event) {
      if (event.metaKey || event.ctrlKey || event.altKey || event.repeat) return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;

      const key = event.key.toLowerCase();
      if (keyTargets[key]) {
        document.getElementById(keyTargets[key]).click();
      } else if (key === 'e') {
        copyEmail();
      } else if (key === 't') {
        nextTheme();
      }
    });

    console.log('%c o5102o ', 'font-family:monospace;font-size:20px;color:#dcdcdc;background:#1b00c8;border-radius:3px', '\nhttps://github.com/jaylee1020/o5102o.com');

    const introLines = Array.from(document.querySelectorAll('.intro-line'));
    const prefersReducedMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;

    function typeLine(line, text, speed) {
      return new Promise(function (resolve) {
        line.classList.add('visible');

        if (prefersReducedMotion) {
          line.textContent = text;
          resolve();
          return;
        }

        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        line.appendChild(cursor);

        let index = 0;

        (function tick() {
          if (index < text.length) {
            line.insertBefore(document.createTextNode(text[index]), cursor);
            index += 1;
            window.setTimeout(tick, speed);
            return;
          }

          cursor.remove();
          resolve();
        })();
      });
    }

    (function playIntro() {
      let currentIndex = 0;

      function renderNextLine() {
        if (currentIndex >= introLines.length) {
          return;
        }

        typeLine(introLines[currentIndex], introLines[currentIndex].dataset.text, 25).then(function () {
          currentIndex += 1;
          window.setTimeout(renderNextLine, 120);
        });
      }

      window.setTimeout(renderNextLine, 600);
    })();

    site.registerServiceWorker('/sw.js');
  </script>
