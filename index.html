<!DOCTYPE html>
<html lang="ko" data-theme="1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="o5102o">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <title>o5102o</title>
  <meta name="description" content="JOOYOUNG LEE — designer · developer">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="canonical" href="https://o5102o.com/">
  <meta property="og:title" content="o5102o">
  <meta property="og:description" content="JOOYOUNG LEE — designer · developer">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://o5102o.com/">
  <meta property="og:site_name" content="o5102o">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:image" content="https://o5102o.com/og-image.svg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="o5102o">
  <meta name="twitter:description" content="JOOYOUNG LEE — designer · developer">
  <link rel="stylesheet" href="/shared/base.css">
  <style>
    html[data-theme="1"] { --bg: #1a1a1e; --fg: #dcdcdc; }
    html[data-theme="2"] { --bg: #0078bf; --fg: #ff6c2f; }
    html[data-theme="3"] { --bg: #f65058; --fg: #00a95c; }
    html[data-theme="4"] { --bg: #925f52; --fg: #5ec8e5; }
    html[data-theme="5"] { --bg: #ff48b0; --fg: #ffe916; }

    .theme-row {
      margin-top: 32px;
    }

    .intro-line {
      opacity: 0;
      transform: translateX(-2px);
      transition: opacity 0.3s, transform 0.3s ease;
    }

    .intro-line.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .cursor {
      display: inline-block;
      width: 1px;
      height: 1em;
      margin-left: 1px;
      background: var(--fg);
      vertical-align: text-bottom;
      animation: blink 0.7s steps(2) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media only screen and (max-height:500px) {
      .outer {
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .row-empty {
        height: 12px;
      }

      .section-gap {
        height: 16px;
      }

      .theme-row {
        margin-top: 16px;
      }
    }

    @media only screen and (max-width:768px) {
      .theme-row {
        margin-top: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro-line {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }

      .cursor {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="outer">
    <section class="inner">
      <div class="row"><p>JOOYOUNG LEE</p></div>
      <div class="row"><p class="dim">DESIGNER &amp; DEVELOPER</p></div>
      <div class="section-gap"></div>

      <div class="row"><p class="intro-line dim" data-text="화려한 것을 좋아하는 편입니다."></p></div>
      <div class="row"><p class="intro-line dim" data-text="깊게 또는 가볍게 응시하는 것을 좋아합니다."></p></div>
      <div class="row"><p class="intro-line dim" data-text="예술을 추구하지만 작가는 아닙니다."></p></div>
      <div class="row"><p class="intro-line dim" data-text="디자이너이고 싶습니다."></p></div>
      <div class="row"><p class="intro-line dim" data-text="개발자이고 싶습니다."></p></div>
      <div class="row"><p class="intro-line dim" data-text="AI에 관한 모든 것에 관심이 많고 잘 압니다."></p></div>
      <div class="section-gap"></div>

      <a class="menu-row has-external-indicator" href="https://card.o5102o.com/" target="_blank" rel="noopener noreferrer">
        <span class="btn-label">Card</span>
        <span class="mobile-only">[↗]</span>
      </a>
      <a class="menu-row has-external-indicator" href="https://by.o5102o.com/" target="_blank" rel="noopener noreferrer">
        <span class="btn-label">Portfolio</span>
        <span class="mobile-only">[↗]</span>
      </a>
      <a class="menu-row has-external-indicator" href="https://blog.o5102o.com/" target="_blank" rel="noopener noreferrer">
        <span class="btn-label">Blog</span>
        <span class="mobile-only">[↗]</span>
      </a>
      <a class="menu-row has-external-indicator" href="https://default.o5102o.com/" target="_blank" rel="noopener noreferrer">
        <span class="btn-label">Default 전시</span>
        <span class="mobile-only">[↗]</span>
      </a>
      <div class="section-gap"></div>

      <a class="menu-row has-external-indicator" href="https://github.com/jaylee1020" target="_blank" rel="noopener noreferrer">
        <span class="btn-label">Github</span>
        <span class="mobile-only">[↗]</span>
      </a>
      <a class="menu-row has-external-indicator" href="https://www.instagram.com/o5102o" target="_blank" rel="noopener noreferrer">
        <span class="btn-label">Instagram</span>
        <span class="mobile-only">[↗]</span>
      </a>
      <button class="menu-row has-copy-indicator" id="email-btn" type="button">
        <span class="btn-label">Email</span>
        <span class="mobile-only">[+]</span>
      </button>

      <div class="row theme-row">
        <button class="menu-row" id="theme-btn" type="button">
          <span class="btn-label">Theme</span>
        </button>
      </div>
    </section>
  </main>
  <script type="module" src="/shared/home.js"></script>
</body>
</html>
