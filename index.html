<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="o5102o">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="dns-prefetch" href="https://card.o5102o.com">
  <link rel="dns-prefetch" href="https://by.o5102o.com">
  <link rel="dns-prefetch" href="https://blog.o5102o.com">
  <link rel="dns-prefetch" href="https://default.o5102o.com">
  <title>o5102o</title>
  <meta name="description" content="JOOYOUNG LEE — designer · developer">

  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">

  <link rel="manifest" href="/manifest.json">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="o5102o">
  <meta name="twitter:description" content="JOOYOUNG LEE — designer · developer">
  <style>
    /* ─── Theme tokens ────────────────────────────── */
    [data-theme="dark"] {
      --bg: #09090b; --text: #e4e4e7; --dim: #71717a; --faint: #3f3f46;
      --line: #1c1c20; --gold: #c4a35a; --gold-lo: rgba(196,163,90,0.07);
      --green: #4ade80; --ascii: #27272a;
    }
    [data-theme="light"] {
      --bg: #fafaf9; --text: #1c1917; --dim: #a8a29e; --faint: #d6d3d1;
      --line: #e7e5e4; --gold: #92700c; --gold-lo: rgba(146,112,12,0.06);
      --green: #16a34a; --ascii: #e7e5e4;
    }

    /* ─── Reset ───────────────────────────────────── */
    *{margin:0;padding:0;box-sizing:border-box}

    body {
      background:var(--bg); color:var(--text);
      font-family:"SF Mono",ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Monaco,Consolas,monospace;
      font-weight:400; font-size:13px; line-height:1.65;
      min-height:100vh; min-height:100dvh;
      display:flex; flex-direction:column; align-items:center;
      padding:3rem 1.5rem;
      padding-top:max(3rem,env(safe-area-inset-top));
      -webkit-font-smoothing:antialiased;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      transition:background .3s,color .3s;
    }

    /* ─── Spotlight ────────────────────────────────── */
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
      background:radial-gradient(
        480px circle at calc(var(--mx,.5)*100%) calc(var(--my,.5)*100%),
        var(--gold-lo), transparent 60%
      );
    }
    @media(hover:none){body::before{display:none}}

    /* ─── Container ───────────────────────────────── */
    .hub {
      width:100%; max-width:520px;
      opacity:0; animation:fadeIn .6s cubic-bezier(.16,1,.3,1) .1s forwards;
    }
    @keyframes fadeIn {
      from{opacity:0;transform:translateY(12px)}
      to{opacity:1;transform:translateY(0)}
    }

    /* ─── Header ──────────────────────────────────── */
    h1 { font-size:1.5rem; font-weight:400; letter-spacing:-.02em; line-height:1; }
    .sub { color:var(--gold); font-size:11px; letter-spacing:.25em; margin-top:.45rem; }

    /* ─── Intro ───────────────────────────────────── */
    .intro { margin:1.8rem 0 0; }

    .intro-line {
      color:var(--dim); font-size:12px; line-height:2;
      opacity:0; transform:translateX(-3px);
      transition:opacity .35s,transform .35s ease;
    }
    .intro-line.visible { opacity:1; transform:translateX(0); }

    .cursor {
      display:inline-block; width:1px; height:1.1em;
      background:var(--gold); margin-left:1px;
      vertical-align:text-bottom;
      animation:blink .7s steps(2) infinite;
    }
    @keyframes blink{50%{opacity:0}}

    /* ─── Divider ─────────────────────────────────── */
    hr {
      border:none; height:1px; margin:1.5rem 0;
      background:linear-gradient(90deg,var(--line),transparent 80%);
    }

    /* ─── Links ───────────────────────────────────── */
    .links { list-style:none; }

    .links a {
      display:flex; justify-content:space-between; align-items:baseline;
      padding:.4rem 0; text-decoration:none; color:var(--text);
      transition:color .15s,padding-left .2s cubic-bezier(.16,1,.3,1);
    }
    .links a:hover { color:var(--gold); padding-left:6px; }
    .links a:focus-visible { outline:1px solid var(--gold); outline-offset:2px; }
    .links .tag { color:var(--dim); font-size:11px; transition:color .15s; }
    .links a:hover .tag { color:var(--gold); }

    /* ─── Actions ─────────────────────────────────── */
    .actions {
      margin-top:1.2rem; display:flex; gap:.8rem; flex-wrap:wrap;
    }

    .act {
      background:none; border:none; padding:0;
      font:inherit; font-size:11px; color:var(--dim);
      cursor:pointer; transition:color .15s;
    }
    .act:hover { color:var(--gold); }
    .act a { color:inherit; text-decoration:none; }

    /* ─── ASCII visual ────────────────────────────── */
    .ascii-wrap {
      margin-top:2rem; overflow:hidden;
      height:7.5em; position:relative;
    }

    .ascii-art {
      font-size:11px; line-height:1.35; letter-spacing:.05em;
      color:var(--ascii); user-select:none;
      white-space:pre; overflow:hidden;
      transition:color .3s;
    }

    .ascii-fade {
      position:absolute; bottom:0; left:0; right:0; height:3em;
      background:linear-gradient(transparent,var(--bg));
      pointer-events:none; transition:background .3s;
    }

    /* ─── Exit ────────────────────────────────────── */
    body.leaving { opacity:0; transition:opacity .18s ease; }

    /* ─── Reduced motion ──────────────────────────── */
    @media(prefers-reduced-motion:reduce){
      .hub{animation:none;opacity:1}
      .intro-line{opacity:1;transform:none;transition:none}
      .cursor{animation:none}
      .links a,.act{transition:none}
    }

    ::selection{background:var(--gold-lo);color:var(--text)}
  </style>
</head>
<body>
  <main class="hub">
    <header>
      <p class="sub">JOOYOUNG LEE</p>
    </header>

    <section class="intro" aria-label="소개">
      <p class="intro-line" data-text="화려한것을 좋아하는 편입니다."></p>
      <p class="intro-line" data-text="깊게 또는 가볍게 응시하는것을 좋아합니다."></p>
      <p class="intro-line" data-text="예술을 추구하지만 작가는 아닙니다."></p>
      <p class="intro-line" data-text="디자이너이고 싶습니다"></p>
      <p class="intro-line" data-text="개발자이고 싶습니다."></p>
      <p class="intro-line" data-text="AI의 모든것에 관심이 많고 잘 압니다."></p>
    </section>

    <hr>

    <nav>
      <ul class="links">
        <li><a href="https://card.o5102o.com/"><span>Card</span><span class="tag">[&rarr;]</span></a></li>
        <li><a href="https://by.o5102o.com/"><span>Portfolio</span><span class="tag">[&rarr;]</span></a></li>
        <li><a href="https://blog.o5102o.com/"><span>Blog</span><span class="tag">[&rarr;]</span></a></li>
        <li><a href="https://default.o5102o.com/"><span>Default 전시</span><span class="tag">[&rarr;]</span></a></li>
      </ul>
    </nav>

    <div class="actions">
      <button class="act" id="themeBtn">[◐ theme]</button>
      <span class="act"><a href="https://github.com/jaylee1020" target="_blank" rel="noopener noreferrer">[github]</a></span>
      <span class="act"><a href="https://www.instagram.com/o5102o" target="_blank" rel="noopener noreferrer">[instagram]</a></span>
      <button class="act" id="emailBtn">[email]</button>
    </div>

    <div class="ascii-wrap" aria-hidden="true">
      <pre class="ascii-art" id="ascii"></pre>
      <div class="ascii-fade"></div>
    </div>
  </main>

  <script>
    /* ─── Theme toggle ────────────────────────────── */
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const stored = localStorage.getItem('theme');
    const systemDark = matchMedia('(prefers-color-scheme:dark)').matches;

    function setTheme(t) {
      root.setAttribute('data-theme', t);
      localStorage.setItem('theme', t);
      document.querySelector('meta[name="theme-color"]').content =
        t === 'dark' ? '#09090b' : '#fafaf9';
    }

    setTheme(stored || (systemDark ? 'dark' : 'light'));

    themeBtn.addEventListener('click', () => {
      setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    /* ─── Email copy ──────────────────────────────── */
    const emailBtn = document.getElementById('emailBtn');
    emailBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText('jyounglee1020@gmail.com');
        emailBtn.textContent = '[COPIED]';
        setTimeout(() => { emailBtn.textContent = '[email]'; }, 2000);
      } catch {
        location.href = 'mailto:jyounglee1020@gmail.com';
      }
    });

    /* ─── Typing animation ────────────────────────── */
    const lines = document.querySelectorAll('.intro-line');
    const noMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;

    function typeLine(el, text, speed) {
      return new Promise((done) => {
        el.classList.add('visible');
        if (noMotion) { el.textContent = text; done(); return; }
        const c = document.createElement('span');
        c.className = 'cursor';
        el.appendChild(c);
        let i = 0;
        (function tick() {
          if (i < text.length) {
            el.insertBefore(document.createTextNode(text[i++]), c);
            setTimeout(tick, speed);
          } else { c.remove(); done(); }
        })();
      });
    }

    (async () => {
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      await wait(700);
      for (const l of lines) {
        await typeLine(l, l.dataset.text, 30);
        await wait(150);
      }
    })();

    /* ─── ASCII noise field ───────────────────────── */
    const asciiEl = document.getElementById('ascii');
    const chars = ' .·:+*#@';
    const W = Math.min(60, Math.floor((innerWidth - 48) / 7.2));
    const H = 8;
    let mx = 0.5, my = 0.5;
    let frame = 0;

    function noise(x, y, t) {
      const a = Math.sin(x * 0.15 + t * 0.8) * 0.5;
      const b = Math.cos(y * 0.3 + t * 0.5) * 0.5;
      const c = Math.sin((x + y) * 0.1 + t * 1.2) * 0.3;
      const d = Math.cos(x * 0.05 - t * 0.3) * Math.sin(y * 0.2 + t * 0.6) * 0.4;
      return (a + b + c + d + 0.7) * 0.5;
    }

    function renderASCII() {
      let out = '';
      const t = frame * 0.02;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const dx = (x / W - mx) * 2;
          const dy = (y / H - my) * 2;
          const dist = 1 - Math.min(1, Math.sqrt(dx * dx + dy * dy) * 0.7);
          const n = noise(x, y, t) * dist;
          const idx = Math.floor(Math.max(0, Math.min(1, n)) * (chars.length - 1));
          out += chars[idx];
        }
        if (y < H - 1) out += '\n';
      }
      asciiEl.textContent = out;
      frame++;
      requestAnimationFrame(renderASCII);
    }

    renderASCII();

    /* ─── Mouse tracking ──────────────────────────── */
    if (matchMedia('(hover:hover)').matches) {
      document.addEventListener('mousemove', (e) => {
        const x = (e.clientX / innerWidth).toFixed(3);
        const y = (e.clientY / innerHeight).toFixed(3);
        document.body.style.setProperty('--mx', x);
        document.body.style.setProperty('--my', y);
        mx = +x; my = +y;
      });
    }

    /* ─── Page exit ───────────────────────────────── */
    document.querySelectorAll('.links a').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        document.body.classList.add('leaving');
        setTimeout(() => { location.href = a.href; }, 180);
      });
    });

    /* ─── SW ──────────────────────────────────────── */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
