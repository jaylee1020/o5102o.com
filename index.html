<!DOCTYPE html>

<head>

  <meta name="twitter:card" content="summary">

  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: "D2Coding", "Nanum Gothic Coding", "Noto Sans Mono CJK KR", monospace;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .hub {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 0.35rem;
    }

    .desc {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 2.5rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      list-style: none;
    }

    .links a {
      display: block;
      padding: 0.9rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e8e8e8;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      transition: border-color 0.2s, background 0.2s;
    }

    .links a:hover,
    .links a:focus-visible {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.04);
      outline: none;
    }

    .links .label {
      display: block;
      font-weight: 600;
    }

    .links .sub {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.4);
    }

    footer {
      margin-top: 3rem;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.25);
    }

    footer a {
      color: rgba(255, 255, 255, 0.35);
      text-decoration: none;
    }

    footer a:hover { color: rgba(255, 255, 255, 0.6); }

    @media (prefers-color-scheme: light) {
      html, body {
        background: #f7f7f7;
        color: #111;
      }
      .desc { color: rgba(0, 0, 0, 0.45); }
      .links a {
        border-color: rgba(0, 0, 0, 0.1);
        color: #111;
      }
      .links a:hover,
      .links a:focus-visible {
        border-color: rgba(0, 0, 0, 0.3);
        background: rgba(0, 0, 0, 0.03);
      }
      .links .sub { color: rgba(0, 0, 0, 0.4); }
      footer { color: rgba(0, 0, 0, 0.25); }
      footer a { color: rgba(0, 0, 0, 0.35); }
      footer a:hover { color: rgba(0, 0, 0, 0.6); }
    }

    @media (prefers-reduced-motion: reduce) {
      .links a { transition: none; }
    }
  </style>
</head>
<body>
  <main class="hub">
    <p class="name">o5102o</p>
    <p class="desc">이주영(Jay) — designer · developer</p>
    <ul class="links">
      <li>
        <a href="https://card.o5102o.com/" target="_blank" rel="noopener noreferrer">
          <span class="label">Card</span>
          <span class="sub">developer card + contact</span>
        </a>
      </li>
      <li>
        <a href="https://by.o5102o.com/" target="_blank" rel="noopener noreferrer">
          <span class="label">Portfolio</span>
          <span class="sub">by o5102o</span>
        </a>
      </li>
      <li>
        <a href="https://default.o5102o.com/" target="_blank" rel="noopener noreferrer">
          <span class="label">Exhibition</span>
          <span class="sub">webcam particle poster</span>
        </a>
      </li>
    </ul>
  </main>
  <footer>
    <a href="https://github.com/jaylee1020" target="_blank" rel="noopener noreferrer">github</a>
  </footer>
</body>
</html>
