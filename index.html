  <style>
    /* ─── Themes ──────────────────────────────────── */
    html[data-theme="1"]{--bg:#fafaf9;--fg:#292524}
    html[data-theme="2"]{--bg:#d6d3d1;--fg:#1c1917}
    html[data-theme="3"]{--bg:#c4a35a;--fg:#1c1917}
    html[data-theme="4"]{--bg:#44444a;--fg:#b4b4b7}
    html[data-theme="5"]{--bg:#0a0a0b;--fg:#4ade80}
    html[data-theme="6"]{--bg:#0a0a0b;--fg:#d4d4d8}
    html[data-theme="7"]{--bg:#0a0a0b;--fg:#c4a35a}
    html[data-theme="8"]{--bg:#2449d1;--fg:#ffffff}

    :root{--copy-text:" [+]"}

    /* ─── Reset ───────────────────────────────────── */
    *{margin:0;padding:0;box-sizing:border-box}
    body{line-height:1}
    button{border:none;background:none;font:inherit;color:inherit;cursor:default}

    /* ─── Base ────────────────────────────────────── */
    html,body{
      min-height:100vh;min-height:100dvh;height:100%;
      font-size:16px;line-height:24px;
      font-family:"SF Mono",ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Monaco,Consolas,monospace;
      font-weight:400;
      background:var(--bg);color:var(--fg);
      -webkit-font-smoothing:antialiased;
      -webkit-tap-highlight-color:transparent;
    }

    .mobile-only{display:none}

    /* ─── Layout ──────────────────────────────────── */
    .outer{
      width:100vw;height:100vh;
      display:grid;align-items:center;justify-content:center;
      min-height:580px;
    }

    .inner{
      position:relative;
      width:calc(100vw - 74px);
      height:round(down,calc(100vh - 80px),24px);
      min-height:456px;
    }

    .content{position:relative;z-index:2}

    /* ─── Rows ────────────────────────────────────── */
    .row{height:24px;user-select:none;width:100%}
    .row p{display:inline-block;padding-left:3px;border-radius:2px}
    .row-empty{height:24px}
    .row-bottom{position:absolute;bottom:0}
    .dim{opacity:.45}

    /* ─── Hover indicators (p.cv pattern) ─────────── */
    .link:focus-visible::after,.link:hover::after,.link:active::after{
      display:inline;content:" [↗]"
    }
    .nolink:focus-visible::after,.nolink:hover::after{
      display:inline;content:" [-]"
    }
    .copy:focus-visible::after,.copy:hover::after,.copy:active::after{
      display:inline;content:var(--copy-text)
    }
    .switch:focus-visible::after,.switch:hover::after,.switch:active::after{
      display:inline;content:" [⬏]"
    }

    button{padding-left:3px;border-radius:2px;text-transform:uppercase}
    button:focus-visible{color:var(--bg);background:var(--fg);outline:none}
    button:active{color:var(--bg);background:var(--fg)}

    /* ─── ASCII ───────────────────────────────────── */
    .ascii{
      position:absolute;width:62%;height:100%;
      right:3px;top:0;z-index:1;
    }
    .ascii pre{
      margin:0;padding:0;width:100%;height:100%;
      font:inherit;text-align:right;user-select:none;
      overflow:hidden;
    }

    /* ─── Mobile ──────────────────────────────────── */
    @media only screen and (max-width:768px){
      body{font-size:17px;line-height:30px}
      .mobile-only{display:block}
      button.mobile-only{display:flex}
      .outer{display:block;width:100%;height:100%;padding:30px 22px;min-width:320px}
      .inner{display:block;width:100%;height:100%;min-height:auto}
      .row{height:30px}
      .row-empty{height:30px}
      button,.nolink{padding-left:3px;font-size:17px;line-height:30px;width:100%;display:flex}
      .btn-label{flex-grow:1;text-align:left}
      .link::after,.nolink::after,.copy::after,.switch::after{content:""!important}
      .ascii{display:none}
      .row-bottom{position:relative;margin-top:30px}
    }

    @media(prefers-reduced-motion:reduce){
      .intro-line{opacity:1!important;transform:none!important;transition:none!important}
      .cursor{animation:none!important}
    }

    /* ─── Typing ──────────────────────────────────── */
    .intro-line{
      opacity:0;transform:translateX(-2px);
      transition:opacity .3s,transform .3s ease;
    }
    .intro-line.visible{opacity:1;transform:translateX(0)}
    .cursor{
      display:inline-block;width:1px;height:1em;
      background:var(--fg);margin-left:1px;vertical-align:text-bottom;
      animation:blink .7s steps(2) infinite;
    }
    @keyframes blink{50%{opacity:0}}
  </style>
</head>
<body>
  <div class="outer">
    <div class="inner">

      <div class="content">
        <div class="row"><p>JOOYOUNG LEE</p></div>
        <div class="row"><p class="dim">Designer · Developer</p></div>
        <div class="row row-empty"></div>

        <div class="row"><p class="intro-line dim" data-text="화려한것을 좋아하는 편입니다."></p></div>
        <div class="row"><p class="intro-line dim" data-text="깊게 또는 가볍게 응시하는것을 좋아합니다."></p></div>
        <div class="row"><p class="intro-line dim" data-text="예술을 추구하지만 작가는 아닙니다."></p></div>
        <div class="row"><p class="intro-line dim" data-text="디자이너이고 싶습니다"></p></div>
        <div class="row"><p class="intro-line dim" data-text="개발자이고 싶습니다."></p></div>
        <div class="row"><p class="intro-line dim" data-text="AI의 모든것에 관심이 많고 잘 압니다."></p></div>
        <div class="row row-empty"></div>

        <div class="row">
          <button class="link" id="l-card">

        <div class="row">
          <button class="link" id="l-portfolio">

          </button>
        </div>
        <div class="row">
          <button class="link" id="l-blog">
            <span class="btn-label">Blog</span>

          </button>
        </div>
        <div class="row">
          <button class="link" id="l-exhibit">
            <span class="btn-label">Default 전시</span>

          </button>
        </div>
        <div class="row row-empty"></div>

        <div class="row">
          <button class="link" id="l-github">
            <span class="btn-label">Github</span>

          </button>

        <div class="row">

  <script>
    /* ─── Links ───────────────────────────────────── */
    var urls = {
      'l-card':      'https://card.o5102o.com/',
      'l-portfolio': 'https://by.o5102o.com/',
      'l-blog':      'https://blog.o5102o.com/',
      'l-exhibit':   'https://default.o5102o.com/',
      'l-github':    'https://github.com/jaylee1020',
      'l-instagram': 'https://www.instagram.com/o5102o'
    };

    Object.keys(urls).forEach(function(id) {
      document.getElementById(id).addEventListener('click', function() {
        window.open(urls[id], '_blank');
      });
    });

    /* ─── Email copy ──────────────────────────────── */
    var emailBtn = document.getElementById('email-btn');
    var emailMobile = emailBtn.querySelector('.mobile-only');

    emailBtn.addEventListener('click', function() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText('jyounglee1020@gmail.com').then(function() {
          document.documentElement.style.setProperty('--copy-text', '" [COPIED]"');
          if (emailMobile) emailMobile.textContent = '[COPIED]';
          setTimeout(function() {
            document.documentElement.style.setProperty('--copy-text', '" [+]"');
            if (emailMobile) emailMobile.textContent = '[+]';
          }, 2000);
        });
      } else {
        window.location.href = 'mailto:jyounglee1020@gmail.com';
      }
    });

    /* ─── Theme toggle ────────────────────────────── */
    var themeBtn = document.getElementById('theme-btn');
    var totalThemes = 8;
    var stored = localStorage.getItem('theme');
    var systemDark = window.matchMedia('(prefers-color-scheme:dark)').matches;

    if (stored) {
      document.documentElement.setAttribute('data-theme', stored);
    } else if (!systemDark) {
      document.documentElement.setAttribute('data-theme', '1');
    }

    themeBtn.addEventListener('click', function() {
      var current = parseInt(document.documentElement.getAttribute('data-theme')) || 6;
      var next = (current % totalThemes) + 1;
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    /* ─── Typing animation ────────────────────────── */
    var lines = document.querySelectorAll('.intro-line');
    var noMotion = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

    function typeLine(el, text, speed) {
      return new Promise(function(done) {
        el.classList.add('visible');
        if (noMotion) { el.textContent = text; done(); return; }
        var c = document.createElement('span');
        c.className = 'cursor';
        el.appendChild(c);
        var i = 0;
        (function tick() {
          if (i < text.length) {
            el.insertBefore(document.createTextNode(text[i++]), c);
            setTimeout(tick, speed);
          } else { c.remove(); done(); }
        })();
      });
    }

    (function runTyping() {
      var idx = 0;
      function next() {
        if (idx >= lines.length) return;
        typeLine(lines[idx], lines[idx].dataset.text, 25).then(function() {
          idx++;
          setTimeout(next, 120);
        });
      }
      setTimeout(next, 600);
    })();

    /* ─── Particle-attractor ASCII field ─────────── */
    /* Technique from chenglou.me/pretext — particle-and-attractor brightness field */
    var asciiEl = document.getElementById('ascii');
    var RAMP = " .`-_:,;^=+/|)\\!?0oOQ#%@";
    var cellW = 9.6, lineH = 24;
    var OVERSAMPLE = 2;
    var DECAY = 0.82;
    var PARTICLE_N = 100;
    var SPRITE_R = 12;
    var ATT_R1 = 24, ATT_R2 = 10;
    var ATT_F1 = 0.22, ATT_F2 = 0.05;

    function getGridSize() {
      var r = asciiEl.parentElement.getBoundingClientRect();
      return { cols: Math.floor(r.width / cellW), rows: Math.floor(r.height / lineH) };
    }

    var gSize = getGridSize();
    var COLS = gSize.cols, ROWS = gSize.rows;
    var FC = COLS * OVERSAMPLE, FR = ROWS * OVERSAMPLE;
    var CW = COLS * 4, CH = ROWS * 4;
    var FSX = FC / CW, FSY = FR / CH;
    var field = new Float32Array(FC * FR);

    /* Particles */
    var particles = [];
    for (var i = 0; i < PARTICLE_N; i++) {
      var ang = Math.random() * Math.PI * 2;
      var rad = Math.random() * 40 + 20;
      particles.push({
        x: CW / 2 + Math.cos(ang) * rad,
        y: CH / 2 + Math.sin(ang) * rad,
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8
      });
    }

    /* Radial stamp */
    function makeStamp(rpx) {
      var rx = Math.ceil(rpx * FSX), ry = Math.ceil(rpx * FSY);
      var sx = rx * 2 + 1, sy = ry * 2 + 1;
      var v = new Float32Array(sx * sy);
      for (var y = -ry; y <= ry; y++) {
        for (var x = -rx; x <= rx; x++) {
          var nd = Math.sqrt((x / (rpx * FSX)) ** 2 + (y / (rpx * FSY)) ** 2);
          var a = nd >= 1 ? 0 : nd <= 0.35 ? 0.45 + (0.15 - 0.45) * (nd / 0.35) : 0.15 * (1 - (nd - 0.35) / 0.65);
          v[(y + ry) * sx + x + rx] = a;
        }
      }
      return { rx: rx, ry: ry, sx: sx, sy: sy, v: v };
    }

    var pStamp = makeStamp(SPRITE_R);
    var a1Stamp = makeStamp(ATT_R1);
    var a2Stamp = makeStamp(ATT_R2);

    function splat(cx, cy, st) {
      var gcx = Math.round(cx * FSX), gcy = Math.round(cy * FSY);
      for (var y = -st.ry; y <= st.ry; y++) {
        var gy = gcy + y;
        if (gy < 0 || gy >= FR) continue;
        var fro = gy * FC, sro = (y + st.ry) * st.sx;
        for (var x = -st.rx; x <= st.rx; x++) {
          var gx = gcx + x;
          if (gx < 0 || gx >= FC) continue;
          var sv = st.v[sro + x + st.rx];
          if (sv === 0) continue;
          var fi = fro + gx;
          field[fi] = Math.min(1, field[fi] + sv);
        }
      }
    }

    function renderASCII(now) {
      /* Attractors orbit */
      var a1x = Math.cos(now * 0.0007) * CW * 0.25 + CW / 2;
      var a1y = Math.sin(now * 0.0011) * CH * 0.3 + CH / 2;
      var a2x = Math.cos(now * 0.0013 + Math.PI) * CW * 0.2 + CW / 2;
      var a2y = Math.sin(now * 0.0009 + Math.PI) * CH * 0.25 + CH / 2;

      /* Update particles */
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        var d1x = a1x - p.x, d1y = a1y - p.y;
        var d2x = a2x - p.x, d2y = a2y - p.y;
        var dist1 = d1x * d1x + d1y * d1y;
        var dist2 = d2x * d2x + d2y * d2y;
        var ax = dist1 < dist2 ? d1x : d2x;
        var ay = dist1 < dist2 ? d1y : d2y;
        var dist = Math.sqrt(Math.min(dist1, dist2)) + 1;
        var force = dist1 < dist2 ? ATT_F1 : ATT_F2;
        p.vx += ax / dist * force + (Math.random() - 0.5) * 0.25;
        p.vy += ay / dist * force + (Math.random() - 0.5) * 0.25;
        p.vx *= 0.97; p.vy *= 0.97;
        p.x += p.vx; p.y += p.vy;
        if (p.x < -SPRITE_R) p.x += CW + SPRITE_R * 2;
        if (p.x > CW + SPRITE_R) p.x -= CW + SPRITE_R * 2;
        if (p.y < -SPRITE_R) p.y += CH + SPRITE_R * 2;
        if (p.y > CH + SPRITE_R) p.y -= CH + SPRITE_R * 2;
      }

      /* Decay + splat */
      for (var j = 0; j < field.length; j++) field[j] *= DECAY;
      for (var i = 0; i < particles.length; i++) splat(particles[i].x, particles[i].y, pStamp);
      splat(a1x, a1y, a1Stamp);
      splat(a2x, a2y, a2Stamp);

      /* Render to text */
      var out = '';
      for (var row = 0; row < ROWS; row++) {
        var frs = row * OVERSAMPLE * FC;
        for (var col = 0; col < COLS; col++) {
          var fcs = col * OVERSAMPLE;
          var b = 0;
          for (var sy = 0; sy < OVERSAMPLE; sy++) {
            var sro = frs + sy * FC + fcs;
            for (var sx = 0; sx < OVERSAMPLE; sx++) b += field[sro + sx];
          }
          var bb = Math.min(255, b / (OVERSAMPLE * OVERSAMPLE) * 255 | 0);
          var ci = Math.min(RAMP.length - 1, bb / 255 * RAMP.length | 0);
          out += RAMP[ci];
        }
        if (row < ROWS - 1) out += '\n';
      }
      asciiEl.textContent = out;
      requestAnimationFrame(renderASCII);
    }

    if (window.innerWidth > 768) {
      requestAnimationFrame(renderASCII);
    }

    /* ─── SW ──────────────────────────────────────── */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function() {});
    }
  </script>
</body>
