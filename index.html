<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="o5102o">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="dns-prefetch" href="https://card.o5102o.com">
  <link rel="dns-prefetch" href="https://by.o5102o.com">
  <link rel="dns-prefetch" href="https://blog.o5102o.com">
  <link rel="dns-prefetch" href="https://default.o5102o.com">
  <link rel="preconnect" href="https://card.o5102o.com" crossorigin>
  <title>o5102o</title>
  <meta name="description" content="이주영(Jay) — designer · developer">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <link rel="canonical" href="https://o5102o.com/">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <meta property="og:title" content="o5102o">
  <meta property="og:description" content="이주영(Jay) — designer · developer">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://o5102o.com/">
  <meta property="og:site_name" content="o5102o">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:image" content="https://o5102o.com/og-image.svg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="o5102o">
  <meta name="twitter:description" content="이주영(Jay) — designer · developer">
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --border: #27272a;
      --border-hover: #3f3f46;
      --text: #fafafa;
      --text-2: #a1a1aa;
      --text-3: #71717a;
      --accent: #4ade80;
      --accent-muted: rgba(74, 222, 128, 0.08);
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafafa;
        --surface: #f4f4f5;
        --border: #e4e4e7;
        --border-hover: #d4d4d8;
        --text: #09090b;
        --text-2: #52525b;
        --text-3: #a1a1aa;
        --accent: #16a34a;
        --accent-muted: rgba(22, 163, 74, 0.06);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: dark light; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      padding-top: max(2rem, env(safe-area-inset-top));
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hub {
      width: 100%;
      max-width: 380px;
      animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .hero {
      text-align: center;
      margin-bottom: 3rem;
    }

    .name {
      font-family: var(--mono);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
    }

    .role {
      font-size: 0.82rem;
      color: var(--text-3);
      letter-spacing: 0.01em;
    }

    nav { display: flex; flex-direction: column; }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
      border-top: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      transition: padding-left 0.2s ease;
    }

    .nav-item:last-child {
      border-bottom: 1px solid var(--border);
    }

    .nav-item:hover {
      padding-left: 6px;
    }

    .nav-item:hover .nav-label { color: var(--accent); }
    .nav-item:hover .nav-arrow { opacity: 1; transform: translateX(0); }

    .nav-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .nav-label {
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: color 0.15s;
    }

    .nav-desc {
      display: block;
      font-size: 0.72rem;
      color: var(--text-3);
      margin-top: 0.15rem;
    }

    .nav-arrow {
      font-size: 0.8rem;
      color: var(--text-3);
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.2s, transform 0.2s;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
    }

    footer a {
      font-size: 0.7rem;
      color: var(--text-3);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.15s;
    }

    footer a:hover { color: var(--text-2); }

    @media (prefers-reduced-motion: reduce) {
      .hub { animation: none; }
      .nav-item, .nav-arrow, .nav-label, footer a { transition: none; }
    }

    ::selection { background: var(--accent-muted); color: var(--text); }
  </style>
</head>
<body>
  <main class="hub">
    <header class="hero">
      <h1 class="name">o5102o</h1>
      <p class="role">이주영(Jay) &mdash; designer &middot; developer</p>
    </header>

    <nav>
      <a class="nav-item" href="https://card.o5102o.com/">
        <div>
          <span class="nav-label">Card</span>
          <span class="nav-desc">developer card + contact</span>
        </div>
        <span class="nav-arrow">&rarr;</span>
      </a>
      <a class="nav-item" href="https://by.o5102o.com/">
        <div>
          <span class="nav-label">Portfolio</span>
          <span class="nav-desc">by o5102o</span>
        </div>
        <span class="nav-arrow">&rarr;</span>
      </a>
      <a class="nav-item" href="https://blog.o5102o.com/">
        <div>
          <span class="nav-label">Blog</span>
          <span class="nav-desc">thoughts, notes, and logs</span>
        </div>
        <span class="nav-arrow">&rarr;</span>
      </a>
      <a class="nav-item" href="https://default.o5102o.com/">
        <div>
          <span class="nav-label">Default 전시</span>
          <span class="nav-desc">interactive exhibit</span>
        </div>
        <span class="nav-arrow">&rarr;</span>
      </a>
    </nav>
  </main>

  <footer>
    <a href="https://github.com/jaylee1020" target="_blank" rel="noopener noreferrer">github</a>
    <a href="https://www.instagram.com/o5102o" target="_blank" rel="noopener noreferrer">instagram</a>
  </footer>
</body>
</html>
