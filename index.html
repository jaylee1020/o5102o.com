<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Camera View</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      font-family: "D2Coding", "Nanum Gothic Coding", "Noto Sans Mono CJK KR", monospace;
    }

    #screen {
      background: #000;
      display: block;
      cursor: none;
    }

    #chat-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
      width: 1px;
      height: 1px;
    }

    #camera,
    #buffer {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .status-overlay[hidden] {
      display: none;
    }

    .status-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.82);
      pointer-events: none;
    }

    .status-card {
      max-width: 320px;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.88);
      color: #f5f5f5;
      text-align: center;
      line-height: 1.45;
    }

    .status-title {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .status-detail {
      margin: 0;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.82);
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <input id="chat-input" type="text" autocomplete="off">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="buffer"></canvas>
  <div id="status-overlay" class="status-overlay" hidden aria-live="polite" role="alert">
    <div class="status-card">
      <strong class="status-title"></strong>
      <p class="status-detail"></p>
    </div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
