  <body>
    <div id="root"></div>
    <div id="splash" style="position:fixed;inset:0;z-index:9998;background:#000;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center">
      <div style="text-align:center">
        <div style="width:32px;height:32px;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite"></div>
        <p style="font-size:14px;opacity:.6;margin:0">잠시만 기다려주세요</p>
      </div>
    </div>
    <style>
      @keyframes spin{to{transform:rotate(360deg)}}
      #root:not(:empty) ~ #splash{display:none!important}
    </style>
    <div id="camera-error" style="display:none;position:fixed;inset:0;z-index:9999;background:#000;color:#fff;font-family:system-ui,sans-serif;place-items:center">
      <div style="text-align:center;padding:24px;max-width:360px">
        <div style="font-size:48px;margin-bottom:16px">📷</div>
        <h2 id="error-title" style="margin:0 0 8px;font-size:18px;font-weight:700"></h2>
        <p id="error-msg" style="margin:0 0 20px;font-size:14px;opacity:.7;line-height:1.5"></p>
        <button onclick="location.reload()" style="padding:10px 24px;border:1px solid rgba(255,255,255,.3);border-radius:8px;background:transparent;color:#fff;font-size:14px;cursor:pointer">다시 시도</button>
      </div>
    </div>
    <script>
      (function() {
        var el = document.getElementById('camera-error');
        var title = document.getElementById('error-title');
        var msg = document.getElementById('error-msg');
        function show(t, m) {
          title.textContent = t;
          msg.textContent = m;
          el.style.display = 'grid';
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          show('카메라를 사용할 수 없습니다', '이 브라우저는 카메라 기능을 지원하지 않습니다. Safari 또는 Chrome으로 열어주세요.');
          return;
        }
        navigator.permissions && navigator.permissions.query({ name: 'camera' }).then(function(result) {
          if (result.state === 'denied') {
            show('카메라 접근이 차단되었습니다', '설정 > Safari > 카메라 에서 권한을 허용한 후 새로고침 해주세요.');
          }
        }).catch(function() {});
      })();
    </script>
    <noscript>JavaScript is required to run this app.</noscript>
